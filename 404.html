<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex">
    <script>
        if (window.top !== window.self) {
            document.documentElement.style.display = 'none';
            try { window.top.location.replace(window.location.href); } catch (e) {}
        }
        // Same theme and language as the rest of the site
        (function () {
            var root = document.documentElement;
            try {
                var t = localStorage.getItem('theme');
                if (t === 'dark' || t === 'light') root.setAttribute('data-theme', t);
                var l = localStorage.getItem('lang');
                if (l !== 'en' && l !== 'es') l = (navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
                root.lang = l;
            } catch (e) {}
            document.title = root.lang === 'es' ? 'Este frame no existe · elserch.com' : 'This frame doesn’t exist · elserch.com';
        })();
    </script>
    <title>This frame doesn’t exist · elserch.com</title>
    <link rel="icon" type="image/svg+xml" href="/assets/elserch-logo.svg">
    <style>
        @font-face { font-family: 'Inter Tight'; font-weight: 500; font-display: swap; src: url('/assets/fonts/inter-tight-500.woff2') format('woff2'); }
        @font-face { font-family: 'Geist Mono'; font-weight: 500; font-display: swap; src: url('/assets/fonts/geist-mono-500.woff2') format('woff2'); }

        :root {
            --brand: #e456ad;
            --ink: #0b0b0b;
            --muted: #6b6b6b;
            --bg: #f3f3f1;
            --card: #ffffff;
            --line: #e2e2de;
            --dot: rgba(11, 11, 11, 0.09);
            --select: #2f6bff;
        }
        :root[data-theme="dark"] {
            --ink: #f6f6f6; --muted: #9a9a9a; --bg: #0d0d0d; --card: #151517; --line: #26262a; --dot: rgba(255, 255, 255, 0.07); --select: #5b8cff;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --ink: #f6f6f6; --muted: #9a9a9a; --bg: #0d0d0d; --card: #151517; --line: #26262a; --dot: rgba(255, 255, 255, 0.07); --select: #5b8cff;
            }
        }

        [lang="en"] [lang="es"], [lang="es"] [lang="en"] { display: none; }

        * { box-sizing: border-box; margin: 0; }

        body {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 2rem 16px;
            background: radial-gradient(var(--dot) 1px, transparent 1.2px) 0 0 / 18px 18px, var(--bg);
            color: var(--ink);
            font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: min(560px, 100%);
        }

        .label {
            display: block;
            margin-bottom: 0.5rem;
            font: 500 0.75rem 'Geist Mono', ui-monospace, monospace;
            color: var(--muted);
        }

        /* An empty frame with a dashed "missing" outline */
        .frame {
            position: relative;
            aspect-ratio: 16 / 10;
            border: 1.5px dashed var(--line);
            border-radius: 4px;
            background: var(--card);
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .code {
            font-size: clamp(5rem, 3rem + 10vw, 9rem);
            font-weight: 500;
            letter-spacing: -0.05em;
            line-height: 1;
            color: var(--line);
        }

        .orb {
            position: absolute;
            width: 34%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--brand);
            right: -8%;
            bottom: -14%;
        }

        .cursor {
            position: absolute;
            left: 22%;
            top: 30%;
            display: flex;
            gap: 2px;
            animation: wander 7s ease-in-out infinite;
        }

        .cursor svg { width: 16px; height: 16px; fill: var(--select); stroke: #fff; stroke-width: 1.2; stroke-linejoin: round; }

        .tag { margin-top: 12px; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }

        .tag b {
            padding: 2px 7px;
            border-radius: 5px;
            background: #1f5af0;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tag > span {
            max-width: 220px;
            padding: 6px 10px 7px;
            border-radius: 2px 12px 12px 12px;
            background: #1f5af0;
            color: #fff;
            font-size: 0.85rem;
            line-height: 1.3;
        }

        @keyframes wander {
            0%, 100% { transform: translate(0, 0); }
            35% { transform: translate(40px, 18px); }
            70% { transform: translate(-12px, 30px); }
        }

        h1 {
            margin-top: 2rem;
            font-size: clamp(1.8rem, 1.3rem + 2vw, 2.5rem);
            font-weight: 500;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        p.sub {
            margin-top: 0.4rem;
            font-size: clamp(1.1rem, 1rem + 0.5vw, 1.35rem);
            letter-spacing: -0.01em;
            color: var(--muted);
        }

        .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.75rem; }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.35rem;
            border-radius: 8px;
            font: 500 0.98rem 'Inter Tight', sans-serif;
            text-decoration: none;
        }

        .btn-primary { background: var(--brand); color: #0b0b0b; }
        .btn-dark { background: var(--ink); color: var(--bg); }
        .btn:focus-visible { outline: 2px solid var(--select); outline-offset: 2px; }

        @media (hover: hover) {
            .btn-primary:hover { background: #ec71bb; }
            .btn-dark:hover { opacity: 0.85; }
        }

        @media (prefers-reduced-motion: reduce) {
            .cursor { animation: none; }
        }
    </style>
</head>
<body>
    <main>
        <span class="label">elserch / 404</span>
        <div class="frame" aria-hidden="true">
            <span class="code">404</span>
            <span class="orb"></span>
            <span class="cursor">
                <svg viewBox="0 0 16 16"><path d="M1 1l5.5 13 1.8-5.2L13.5 7z"/></svg>
                <span class="tag"><b>Serch</b><span><span lang="en">Hmm, I don’t think I designed this one.</span><span lang="es">Mmm, creo que este no lo diseñé yo.</span></span></span>
            </span>
        </div>
        <h1><span lang="en">This frame doesn’t exist.</span><span lang="es">Este frame no existe.</span></h1>
        <p class="sub"><span lang="en">The page moved, or the link has a typo.</span><span lang="es">La página se movió o el enlace tiene un error.</span></p>
        <div class="actions">
            <a class="btn btn-primary" href="/"><span lang="en">Back to the home page</span><span lang="es">Volver al inicio</span></a>
            <a class="btn btn-dark" href="/#portfolio"><span lang="en">See my work</span><span lang="es">Ver mi trabajo</span></a>
        </div>
    </main>
</body>
</html>
